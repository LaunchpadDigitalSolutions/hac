<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Home | HAC</title>
<style>
:root {
  --g: #2E7D52;
  --gl: #E8F2EC;
  --gd: #1D5235;
  --yellow: #F5CB00;
  --blue: #1565C0;
  --white: #FFFFFF;
  --bg: #F2F5F2;
  --border: #D8E8D8;
  --text: #1A1A1A;
  --muted: #6B7280;
  --danger: #B91C1C;
  --danger-bg: #FEE2E2;
  --warn-bg: #FEF3C7;
  --warn: #B45309;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;background:var(--bg);color:var(--text);overscroll-behavior:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

/* Checker band */
.checker{height:20px;background-image:conic-gradient(var(--g) 90deg,var(--yellow) 90deg 180deg,var(--g) 180deg 270deg,var(--yellow) 270deg);background-size:20px 20px}

/* Header */
.hac-header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hac-header img{width:36px;height:36px;border-radius:18px;background:#fff;object-fit:contain}
.hac-header .title{font-size:17px;font-weight:500}
.hac-header .sub{font-size:12px;color:rgba(255,255,255,0.75);margin-top:1px}
.hac-header-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* Bottom nav */
.bot-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:0.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.bot-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);border:none;background:none;text-decoration:none}
.bot-nav a.active{color:var(--g);font-weight:500}
.bot-nav a svg{width:22px;height:22px}
.main{padding:0 0 72px}

/* Cards */
.card{background:#fff;border-radius:12px;border:0.5px solid var(--border);overflow:hidden;margin:0 16px 12px}
.card-header{padding:12px 16px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:14px;font-weight:500}

/* Rows */
.row{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:0.5px solid #f5f5f5}
.row:last-child{border-bottom:none}
.row-icon{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-body{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:500}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Pills */
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill-green{background:var(--gl);color:var(--g)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-danger{background:var(--danger-bg);color:var(--danger)}
.pill-gray{background:#F5F5F5;color:var(--muted)}
.pill-blue{background:#DBEAFE;color:#1D4ED8}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px}
.stat{background:#fff;border-radius:12px;border:0.5px solid var(--border);padding:12px 8px;text-align:center}
.stat-num{font-size:26px;font-weight:500;color:var(--g)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}

/* Buttons */
.btn{display:block;width:100%;padding:14px;border-radius:8px;font-size:15px;font-weight:500;border:none;text-align:center}
.btn-primary{background:var(--g);color:#fff}
.btn-danger{background:#fff;color:var(--danger);border:0.5px solid #FCA5A5}
.btn-ghost{background:#fff;color:var(--text);border:0.5px solid var(--border)}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px}
.form-input{width:100%;padding:11px 13px;border:0.5px solid var(--border);border-radius:8px;font-size:16px;background:#fff;color:var(--text)}
.form-input:focus{outline:none;border-color:var(--g)}

/* Section head */
.section-head{padding:8px 16px 4px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.03em;background:var(--bg)}

/* Login page */
.login-wrap{min-height:100vh;display:flex;flex-direction:column}
.login-body{flex:1;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;width:100%}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{width:80px;height:80px}
.login-title{font-size:22px;font-weight:500;margin-bottom:4px;text-align:center}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:999;display:none}

/* Empty state */
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Page header (green) */
.page-head{background:var(--g);padding:14px 16px}
.page-head h2{color:#fff;font-size:20px;font-weight:500}
.page-head p{color:rgba(255,255,255,0.75);font-size:13px;margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:20px 20px 32px;max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:17px;font-weight:500;margin-bottom:16px}

@media(min-width:768px){
  .bot-nav{display:none}
  .main{padding:0}
  .login-body{padding:40px}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div style="height:20px;background-image:conic-gradient(#2E7D52 90deg,#F5CB00 90deg 180deg,#2E7D52 180deg 270deg,#F5CB00 270deg);background-size:20px 20px"></div>
<header class="hac-header">
  <img src="shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Good morning, Tom</div><div class="sub">Hartlepool Ambulance Charity</div></div>
</header>
<main class="main">

  <div id="next-shift" style="margin:8px 16px 0"><div style="background:#f5f5f5;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px">Loading...</div></div>
  <div class="section-head" style="margin-top:12px">Quick links</div>
  <div class="card">
    <a class="row" href="schedule/index.html"><div class="row-icon" style="background:var(--gl)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="row-body"><div class="row-title">My rota</div><div class="row-sub">View all upcoming shifts</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a>
    <a class="row" href="uniform/index.html"><div class="row-icon" style="background:#EDE9FE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div><div class="row-body"><div class="row-title">Kit request</div><div class="row-sub">Order uniform and equipment</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a>

  </div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>

</nav>
<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
(async()=>{
  const{data:{user}}=await supabase.auth.getUser();
  if(!user){window.location.href='login/index.html';return;}
  const{data:vols}=await supabase.from('volunteers').select('id,name').eq('user_id',user.id).limit(1);
  const vol=vols&&vols[0];
  if(vol){const h=document.querySelector('.hac-header .sub');if(h)h.textContent=vol.name;}
  if(!vol){document.getElementById('next-shift').innerHTML='<div style="background:#f5f5f5;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px">No upcoming shifts</div>';return;}
  const{data:asgn}=await supabase.from('event_assignments').select('event_id').eq('volunteer_id',vol.id);
  const ids=(asgn||[]).map(a=>a.event_id);
  if(!ids.length){document.getElementById('next-shift').innerHTML='<div style="background:#f5f5f5;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px">No upcoming shifts</div>';return;}
  const{data:events}=await supabase.from('events').select('*').in('id',ids).eq('status','approved').gte('date',new Date().toISOString().split('T')[0]).order('date').limit(1);
  const next=(events||[])[0];
  if(!next){document.getElementById('next-shift').innerHTML='<div style="background:#f5f5f5;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px">No upcoming shifts</div>';return;}
  document.getElementById('next-shift').innerHTML=`<div style="background:#2E7D52;border-radius:12px;overflow:hidden"><div style="padding:14px 16px"><div style="font-size:16px;font-weight:500;color:#fff">${next.name}</div><div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:4px">${next.date} &middot; ${next.location}</div></div></div>`;
})();
</script>
