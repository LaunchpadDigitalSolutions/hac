<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Home | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title" id="vol-greeting">Good morning</div><div class="sub">Hartlepool Ambulance Charity</div></div>
</header>
<main class="main">
  <div style="padding:14px 16px 0;font-size:13px;font-weight:500;color:var(--muted)">Next shift</div>
  <div id="next-shift-card" style="margin:8px 16px 0">
    <div class="empty">Loading...</div>
  </div>
  <div class="section-head" style="margin-top:12px">Quick links</div>
  <div class="card">
    <a class="row" href="schedule/index.html"><div class="row-icon" style="background:var(--gl)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="row-body"><div class="row-title">My rota</div><div class="row-sub">View all upcoming shifts</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a>
    <a class="row" href="uniform/index.html"><div class="row-icon" style="background:#EDE9FE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div><div class="row-body"><div class="row-title">Kit request</div><div class="row-sub">Order uniform and equipment</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a>
    <a class="row" href="onboarding/index.html"><div class="row-icon" style="background:#FEF3C7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div><div class="row-body"><div class="row-title">Onboarding</div><div class="row-sub">New volunteer checklist</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a>
  </div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../schedule/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Rota</a>
  <a href="../uniform/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Kit</a>
  <a href="../onboarding/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>
<script src="../shared/auth.js"></script>
<script>
(async () => {
  const p = await requireVolunteer();
  if (!p) return;
  const hr = new Date().getHours();
  document.getElementById('vol-greeting').textContent = (hr<12?'Good morning, ':hr<17?'Good afternoon, ':'Good evening, ') + p.name.split(' ')[0];

  const { data: assignments } = await supabase.from('event_assignments')
    .select('event_id, status')
    .eq('volunteer_id', p.id);

  const eventIds = (assignments||[]).map(a => a.event_id);
  const card = document.getElementById('next-shift-card');

  if (!eventIds.length) { card.innerHTML = '<div class="empty">No upcoming shifts</div>'; return; }

  const { data: events } = await supabase.from('events').select('*')
    .in('id', eventIds).eq('status','approved')
    .gte('date', new Date().toISOString().split('T')[0])
    .order('date').limit(1);

  const next = (events||[])[0];
  if (!next) { card.innerHTML = '<div class="empty">No upcoming shifts</div>'; return; }

  card.innerHTML = `<div style="background:#2E7D52;border-radius:12px;overflow:hidden">
    <div style="padding:14px 16px">
      <div style="font-size:16px;font-weight:500;color:#fff">${next.name}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:4px">${next.date} &middot; ${next.location}</div>
      ${next.attendees?`<div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:2px">${next.attendees} attendees</div>`:''}
    </div>
  </div>`;
})();
</script>
</body></html>
