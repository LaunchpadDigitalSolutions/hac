<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>My Rota | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">My rota</div></div>
</header>
<main class="main">
  <div class="section-head" id="rota-count">Loading...</div>
  <div class="card" id="rota-list"><div class="empty">Loading...</div></div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../schedule/index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Rota</a>
  <a href="../uniform/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Kit</a>
  <a href="../onboarding/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>
<script src="../../shared/auth.js"></script>
<script>
(async () => {
  const p = await requireVolunteer();
  if (!p) return;
  const { data: assignments } = await supabase.from('event_assignments').select('event_id').eq('volunteer_id', p.id);
  const ids = (assignments||[]).map(a => a.event_id);
  if (!ids.length) { document.getElementById('rota-count').textContent = '0 shifts'; document.getElementById('rota-list').innerHTML = '<div class="empty">No shifts assigned yet</div>'; return; }
  const { data: events } = await supabase.from('events').select('*').in('id', ids).order('date');
  const list = events || [];
  document.getElementById('rota-count').textContent = list.length + ' shifts';
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('rota-list').innerHTML = list.map((e,i) => {
    const past = e.date < today;
    const d = new Date(e.date);
    const day = d.toLocaleDateString('en-GB',{weekday:'short'});
    const num = d.getDate();
    const mon = d.toLocaleDateString('en-GB',{month:'short'});
    return `<div class="row" style="opacity:${past?0.5:1}">
      <div style="width:44px;text-align:center;flex-shrink:0">
        <div style="font-size:11px;color:var(--muted)">${day}</div>
        <div style="font-size:22px;font-weight:500;color:${past?'var(--muted)':'#2E7D52'}">${num}</div>
        <div style="font-size:11px;color:var(--muted)">${mon}</div>
      </div>
      <div style="width:1px;background:var(--gl);align-self:stretch;margin:0 12px;flex-shrink:0"></div>
      <div class="row-body">
        <div class="row-title">${e.name}</div>
        <div class="row-sub">${e.location}</div>
      </div>
      <span class="pill ${past?'pill-gray':'pill-green'}">${past?'Done':'Confirmed'}</span>
    </div>`;
  }).join('') || '<div class="empty">No shifts</div>';
})();
</script>
</body></html>
