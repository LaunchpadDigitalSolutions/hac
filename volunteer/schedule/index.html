<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>My Rota | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div style="height:20px;background-image:conic-gradient(#2E7D52 90deg,#F5CB00 90deg 180deg,#2E7D52 180deg 270deg,#F5CB00 270deg);background-size:20px 20px"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">My rota</div></div>
</header>
<main class="main">
  <div class="section-head" id="rota-count">Loading...</div>
  <div class="card" id="rota-list"><div class="empty">Loading...</div></div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../schedule/index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Rota</a>
  <a href="../uniform/index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Kit</a>
  <a href="../onboarding/index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>
<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
(async()=>{
  const{data:vols}=await supabase.from('volunteers').select('id').eq('name','Tom Bradley').limit(1);
  const vol=vols&&vols[0];
  if(!vol){document.getElementById('rota-count').textContent='0 shifts';document.getElementById('rota-list').innerHTML='<div class="empty">No shifts</div>';return;}
  const{data:asgn}=await supabase.from('event_assignments').select('event_id').eq('volunteer_id',vol.id);
  const ids=(asgn||[]).map(a=>a.event_id);
  if(!ids.length){document.getElementById('rota-count').textContent='0 shifts';document.getElementById('rota-list').innerHTML='<div class="empty">No shifts assigned yet</div>';return;}
  const{data:events}=await supabase.from('events').select('*').in('id',ids).order('date');
  const list=events||[];
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('rota-count').textContent=list.length+' shifts';
  document.getElementById('rota-list').innerHTML=list.map(e=>{
    const past=e.date<today;
    const d=new Date(e.date);
    return`<div class="row" style="opacity:${past?0.5:1}"><div style="width:44px;text-align:center;flex-shrink:0"><div style="font-size:11px;color:var(--muted)">${d.toLocaleDateString('en-GB',{weekday:'short'})}</div><div style="font-size:22px;font-weight:500;color:${past?'var(--muted)':'#2E7D52'}">${d.getDate()}</div><div style="font-size:11px;color:var(--muted)">${d.toLocaleDateString('en-GB',{month:'short'})}</div></div><div style="width:1px;background:var(--gl);align-self:stretch;margin:0 12px;flex-shrink:0"></div><div class="row-body"><div class="row-title">${e.name}</div><div class="row-sub">${e.location}</div></div><span class="pill ${past?'pill-gray':'pill-green'}">${past?'Done':'Confirmed'}</span></div>`;
  }).join('')||'<div class="empty">No shifts</div>';
})();
</script>
</body></html>
