<script src="../../shared/auth.js"></script>
<script>
const steps = [
  'Attend induction session with Jason',
  'Complete DBS check',
  'Return signed volunteer agreement',
  'First aid certification confirmed',
  'Uniform ordered and received',
  'Added to WhatsApp group',
  'First event attended'
];

const saved = JSON.parse(localStorage.getItem('hac-onboarding')||'{}');

function renderChecklist() {
  document.getElementById('checklist').innerHTML = steps.map((s,i) => `
    <div class="row" onclick="toggle(${i})" style="cursor:pointer">
      <div style="width:24px;height:24px;border-radius:12px;flex-shrink:0;border:2px solid ${saved[i]?'#2E7D52':'#D4D4D4'};background:${saved[i]?'#2E7D52':'transparent'};display:flex;align-items:center;justify-content:center">
        ${saved[i]?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </div>
      <div class="row-body"><div class="row-title" style="color:${saved[i]?'var(--muted)':'var(--text)'};text-decoration:${saved[i]?'line-through':'none'}">${s}</div></div>
    </div>`).join('');
}

function toggle(i) {
  if (saved[i]) delete saved[i]; else saved[i] = true;
  localStorage.setItem('hac-onboarding', JSON.stringify(saved));
  renderChecklist();
}

(async () => {
  await requireVolunteer();
  renderChecklist();
})();
</script>
