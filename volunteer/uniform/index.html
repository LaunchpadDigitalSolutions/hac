<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Kit Request | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div style="height:20px;background-image:conic-gradient(#2E7D52 90deg,#F5CB00 90deg 180deg,#2E7D52 180deg 270deg,#F5CB00 270deg);background-size:20px 20px"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Kit request</div></div>
</header>
<main class="main" style="padding-top:16px">
  <div style="margin:0 16px 12px;background:var(--gl);border-radius:8px;padding:12px 14px;font-size:14px;color:#1D5235">Select the items you need. Jason will review and approve your request.</div>
  <div class="card" id="kit-items"></div>
  <div style="padding:16px">
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="kit-notes" rows="3" placeholder="Any sizing details or special requests..."></textarea></div>
    <button class="btn btn-primary" onclick="submitKit()">Submit kit request</button>
  </div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../schedule/index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Rota</a>
  <a href="../uniform/index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Kit</a>
  <a href="../onboarding/index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>
<div class="toast" id="toast"></div>
<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
const items=[{name:'Polo shirt',sizes:['XS','S','M','L','XL','2XL']},{name:'Fleece jacket',sizes:['XS','S','M','L','XL','2XL']},{name:'Hi-vis vest',sizes:['S/M','L/XL']},{name:'Trousers',sizes:['28','30','32','34','36','38','40']},{name:'Cap',sizes:['One size']}];
const sel={};
function render(){document.getElementById('kit-items').innerHTML=items.map(item=>`<div class="row" style="flex-direction:column;align-items:flex-start;gap:8px"><div style="display:flex;width:100%;align-items:center;justify-content:space-between"><span class="row-title">${item.name}</span>${sel[item.name]?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':''}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${item.sizes.map(s=>`<span onclick="pick('${item.name}','${s}')" style="font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer;background:${sel[item.name]===s?'#2E7D52':'#F5F5F5'};color:${sel[item.name]===s?'#fff':'var(--text)'};font-weight:${sel[item.name]===s?500:400}">${s}</span>`).join('')}</div></div>`).join('');}
function pick(item,size){if(sel[item]===size)delete sel[item];else sel[item]=size;render();}
async function submitKit(){
  const kitItems=Object.entries(sel).map(([item,size])=>({item,size}));
  if(!kitItems.length){toast('Select at least one item',false);return;}
  const{data:vols}=await supabase.from('volunteers').select('id').eq('name','Tom Bradley').limit(1);
  const vid=vols&&vols[0]&&vols[0].id;
  if(!vid){toast('Demo: add a volunteer named Tom Bradley first',false);return;}
  await supabase.from('kit_orders').insert({volunteer_id:vid,items:kitItems,notes:document.getElementById('kit-notes').value,status:'pending'});
  toast('Kit request submitted!',true);Object.keys(sel).forEach(k=>delete sel[k]);render();
}
render();
</script>
<div style="position:fixed;bottom:64px;left:0;right:0;background:#1A1A1A;display:flex;z-index:200;border-top:1px solid #333">

  <a href="https://hac-admin.launchpadclient.app" style="flex:1;padding:7px 4px;text-align:center;font-size:10px;color:#9CA3AF;text-decoration:none;border-right:1px solid #333"><div style="font-size:14px">⚙️</div>Admin</a>
  <a href="https://hac-volunteer.launchpadclient.app" style="flex:1;padding:7px 4px;text-align:center;font-size:10px;color:#9CA3AF;text-decoration:none"><div style="font-size:14px">🙋</div>Volunteer</a>
</div>
</body></html>
