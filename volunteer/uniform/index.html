<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Kit Request | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Kit request</div></div>
</header>
<main class="main" style="padding-top:16px">
  <div style="padding:0 16px 12px;font-size:14px;color:var(--muted);background:var(--gl);margin:0 16px 12px;border-radius:8px;padding:12px 14px">
    Select the items you need. Jason will review and approve your request.
  </div>
  <div class="card" id="kit-items"></div>
  <div style="padding:16px">
    <div class="form-group"><label class="form-label">Additional notes</label><textarea class="form-input" id="kit-notes" rows="3" placeholder="Any sizing details or special requests..."></textarea></div>
    <button class="btn btn-primary" onclick="submitKit()">Submit kit request</button>
  </div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../schedule/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Rota</a>
  <a href="../uniform/index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Kit</a>
  <a href="../onboarding/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>
<div class="toast" id="toast"></div>
<script src="../../shared/auth.js"></script>
<script>
const kitItems = [
  {name:'Polo shirt', sizes:['XS','S','M','L','XL','2XL']},
  {name:'Fleece jacket', sizes:['XS','S','M','L','XL','2XL']},
  {name:'Hi-vis vest', sizes:['S/M','L/XL']},
  {name:'Trousers', sizes:['28','30','32','34','36','38','40']},
  {name:'Cap', sizes:['One size']}
];
const selected = {};
let volunteerId = null;

function renderKit() {
  document.getElementById('kit-items').innerHTML = kitItems.map((item,i) => `
    <div class="row" style="flex-direction:column;align-items:flex-start;gap:8px">
      <div style="display:flex;width:100%;align-items:center;justify-content:space-between">
        <span class="row-title">${item.name}</span>
        ${selected[item.name]?`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${item.sizes.map(s => `<span onclick="selectSize('${item.name}','${s}')" style="font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer;background:${selected[item.name]===s?'#2E7D52':'#F5F5F5'};color:${selected[item.name]===s?'#fff':'var(--text)'};font-weight:${selected[item.name]===s?'500':'400'}">${s}</span>`).join('')}
      </div>
    </div>`).join('');
}

function selectSize(item, size) {
  if (selected[item] === size) delete selected[item]; else selected[item] = size;
  renderKit();
}

async function submitKit() {
  const items = Object.entries(selected).map(([item,size]) => ({item,size}));
  if (!items.length) { toast('Select at least one item', false); return; }
  const notes = document.getElementById('kit-notes').value;
  const { error } = await supabase.from('kit_orders').insert({
    volunteer_id: volunteerId, items, notes, status: 'pending'
  });
  if (error) { toast('Error: ' + error.message, false); return; }
  toast('Kit request submitted!', true);
  Object.keys(selected).forEach(k => delete selected[k]);
  renderKit();
}

(async () => {
  const p = await requireVolunteer();
  if (!p) return;
  volunteerId = p.id;
  renderKit();
})();
</script>
</body></html>
