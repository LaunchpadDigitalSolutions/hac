<script>
async function loadVMs() {
  const { data: vms } = await supabase.from('voicemails').select('*').order('created_at', {ascending:false});
  const list = vms || [];
  const newCount = list.filter(v => !v.listened).length;
  document.getElementById('vm-count').textContent = list.length + ' voicemails' + (newCount ? ' &middot; ' + newCount + ' new' : '');
  document.getElementById('vm-list').innerHTML = list.length ? list.map(v => `
    <div class="row">
      <div class="row-icon" style="background:${v.listened?'#F5F5F5':'#DBEAFE'}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${v.listened?'#9CA3AF':'#1D4ED8'}" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
      </div>
      <div class="row-body">
        <div class="row-title" style="display:flex;align-items:center;gap:6px">${v.caller_number}${!v.listened?'<span class="pill pill-blue" style="font-size:10px">NEW</span>':''}</div>
        <div class="row-sub">${fmtTime(v.created_at)} &middot; ${fmtDuration(v.duration)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${v.recording_url?`<a href="${v.recording_url}" target="_blank" onclick="markListened('${v.id}')" style="color:var(--g)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></a>`:'<span style="color:var(--muted);font-size:12px">No audio</span>'}
        ${!v.handled?`<button onclick="markHandled('${v.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>`:''}
      </div>
    </div>`).join('') : '<div class="empty">No voicemails</div>';
}

async function markListened(id) { await supabase.from('voicemails').update({listened:true}).eq('id',id); }
async function markHandled(id) { await supabase.from('voicemails').update({handled:true,listened:true}).eq('id',id); toast('Marked as handled',true); loadVMs(); }

(async () => { await requireAdmin(); loadVMs(); })();
</script>
