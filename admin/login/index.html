<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Login | HAC Admin</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="checker"></div>
  <div class="login-body">
    <div class="login-logo"><img src="../../shared/hac-logo.jpg" alt="HAC logo"></div>
    <h1 class="login-title">Admin login</h1>
    <p class="login-sub">Hartlepool Ambulance Charity</p>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="email" placeholder="admin@hac.internal" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="password" required>
      </div>
      <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
    </form>
    <p id="error-msg" style="color:#B91C1C;font-size:14px;text-align:center;margin-top:12px;display:none"></p>
  </div>
  <div style="background:#2E7D52;padding:12px 20px;text-align:center">
    <p style="color:rgba(255,255,255,0.8);font-size:12px">Hartlepool Ambulance Charity &middot; Charity No. 1178331</p>
  </div>
</div>
<script src="../../shared/auth.js"></script>
<script>
(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (user) window.location.href = '../index.html';
})();

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  btn.textContent = 'Signing in...'; btn.disabled = true; err.style.display = 'none';
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });
  if (error) {
    err.textContent = 'Incorrect email or password.'; err.style.display = 'block';
    btn.textContent = 'Sign in'; btn.disabled = false;
  } else {
    window.location.href = '../index.html';
  }
});
</script>
</body></html>
