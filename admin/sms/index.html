<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="../shared/hac.css">

</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">SMS log</div></div>
</header>
<main class="main">

  <div class="card" id="sms-list"><div class="empty">Loading...</div></div>
</main>
<nav class="bot-nav">

  <a href="../events/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Events</a>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Volunteers</a>
  <a href="../calls/index.html" class="active">

  <a href="../settings/index.html" class="">

</nav>
<script src="../../shared/auth.js"></script>
<script>
(async () => {
  await requireAdmin();
  const { data: msgs } = await supabase.from('sms_log').select('*').order('created_at', {ascending:false}).limit(100);
  const list = msgs || [];
  document.getElementById('sms-count').textContent = list.length + ' sent';
  document.getElementById('sms-list').innerHTML = list.length ? list.map(m => `
    <div class="row" style="flex-direction:column;align-items:flex-start;gap:6px">
      <div style="display:flex;width:100%;align-items:center;justify-content:space-between">
        <span class="row-title">${m.recipient_number}</span>
        <span class="pill ${m.status==='delivered'?'pill-green':m.status==='failed'?'pill-danger':'pill-gray'}">${m.status.charAt(0).toUpperCase()+m.status.slice(1)}</span>
      </div>
      <div class="row-sub">${fmtTime(m.created_at)}</div>
      <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%">${m.message}</div>
    </div>`).join('') : '<div class="empty">No SMS sent yet</div>';
})();
</script>
</body></html>
