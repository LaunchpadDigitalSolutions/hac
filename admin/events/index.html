<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Events | HAC Admin</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Events</div></div>
</header>
<main class="main">
  <div id="event-detail" style="display:none">
    <div class="page-head"><h2 id="det-name"></h2><p id="det-date"></p></div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div class="card" style="margin:0">
        <div id="det-fields"></div>
      </div>
      <div id="det-actions" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div id="assign-section" style="display:none;padding:0 16px 16px">
      <div class="section-head" style="padding-left:0;margin-bottom:8px">Assign volunteers</div>
      <div class="card" style="margin:0" id="vol-list"></div>
      <button class="btn btn-primary" style="margin-top:8px" id="confirm-assign-btn">Confirm assignment</button>
    </div>
  </div>
  <div id="event-list">
    <div class="section-head">Pending</div>
    <div class="card" id="list-pending"><div class="empty">Loading...</div></div>
    <div class="section-head">Approved</div>
    <div class="card" id="list-approved"><div class="empty">Loading...</div></div>
    <div class="section-head">Past</div>
    <div class="card" id="list-past"><div class="empty">Loading...</div></div>
  </div>
</main>
<nav class="bot-nav">

  <a href="../events/index.html" class="active">

  <a href="../volunteers/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Volunteers</a>
  <a href="../calls/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Calls</a>

<div class="toast" id="toast"></div>
<script src="../../shared/auth.js"></script>
<script>
let currentEventId = null;
let selectedVols = new Set();
let allVols = [];

(async () => {
  await requireAdmin();

  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) { showDetail(params.get('id')); return; }

  loadList();
})();

async function loadList() {
  document.getElementById('event-list').style.display = '';
  document.getElementById('event-detail').style.display = 'none';

  const { data: events } = await supabase.from('events').select('*').order('date');
  const byStatus = {pending:[],approved:[],past:[]};
  (events||[]).forEach(e => {
    const key = e.status === 'declined' || e.status === 'completed' ? 'past' : e.status;
    if (byStatus[key]) byStatus[key].push(e);
  });

  function row(e) {
    const sc = {pending:'pill-warn',approved:'pill-green',declined:'pill-danger',completed:'pill-gray'};
    return `<div class="row" onclick="showDetail('${e.id}')" style="cursor:pointer">
      <div class="row-body"><div class="row-title">${e.name}</div><div class="row-sub">${e.date} &middot; ${e.location}</div></div>
      <span class="pill ${sc[e.status]||'pill-gray'}">${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span>
    </div>`;
  }

  document.getElementById('list-pending').innerHTML = byStatus.pending.length ? byStatus.pending.map(row).join('') : '<div class="empty">None</div>';
  document.getElementById('list-approved').innerHTML = byStatus.approved.length ? byStatus.approved.map(row).join('') : '<div class="empty">None</div>';
  document.getElementById('list-past').innerHTML = byStatus.past.length ? byStatus.past.map(row).join('') : '<div class="empty">None</div>';
}

async function showDetail(id) {
  currentEventId = id;
  document.getElementById('event-list').style.display = 'none';
  document.getElementById('event-detail').style.display = '';

  const { data: e } = await supabase.from('events').select('*').eq('id', id).single();
  if (!e) return;

  document.getElementById('det-name').textContent = e.name;
  document.getElementById('det-date').textContent = e.date + ' &middot; ' + e.location;

  document.getElementById('det-fields').innerHTML = [
    ['Date', e.date], ['Location', e.location], ['Attendees', e.attendees||'–'],
    ['Contact', e.contact_name||'–'], ['Phone', e.contact_phone||'–'], ['Notes', e.notes||'–']
  ].map(([l,v]) => `<div class="row"><div class="row-body"><div class="row-sub">${l}</div><div class="row-title">${v}</div></div></div>`).join('');

  const actions = document.getElementById('det-actions');
  actions.innerHTML = '';

  if (e.status === 'pending') {
    actions.innerHTML = `
      <button class="btn btn-primary" onclick="updateStatus('approved')">Approve event</button>
      <button class="btn btn-danger" onclick="updateStatus('declined')">Decline</button>
      <button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;
  } else if (e.status === 'approved') {
    actions.innerHTML = `
      <button class="btn btn-primary" onclick="showAssign()">Assign volunteers</button>
      <button class="btn btn-ghost" onclick="updateStatus('completed')">Mark completed</button>
      <button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;
    loadAssignments(id);
  } else {
    actions.innerHTML = `<button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;
  }
}

async function updateStatus(status) {
  await supabase.from('events').update({status, updated_at: new Date().toISOString()}).eq('id', currentEventId);
  toast('Event ' + status, true);
  setTimeout(() => loadList(), 800);
}

async function showAssign() {
  document.getElementById('assign-section').style.display = '';
  const { data: vols } = await supabase.from('volunteers').select('*').eq('active', true).eq('role', 'volunteer');
  allVols = vols || [];

  const { data: existing } = await supabase.from('event_assignments').select('volunteer_id').eq('event_id', currentEventId);
  selectedVols = new Set((existing||[]).map(a => a.volunteer_id));

  renderVolList();
}

function renderVolList() {
  document.getElementById('vol-list').innerHTML = allVols.map(v => `
    <div class="row" onclick="toggleVol('${v.id}')" style="cursor:pointer">
      <div class="row-icon" style="background:${selectedVols.has(v.id)?'var(--gl)':'#F5F5F5'}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${selectedVols.has(v.id)?'#2E7D52':'#9CA3AF'}" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="row-body"><div class="row-title">${v.name}</div><div class="row-sub">${v.qualification||'Volunteer'}</div></div>
      ${selectedVols.has(v.id)?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':''}
    </div>`).join('') || '<div class="empty">No volunteers found</div>';
}

function toggleVol(id) {
  if (selectedVols.has(id)) selectedVols.delete(id); else selectedVols.add(id);
  renderVolList();
}

document.getElementById('confirm-assign-btn')?.addEventListener('click', async () => {
  await supabase.from('event_assignments').delete().eq('event_id', currentEventId);
  if (selectedVols.size > 0) {
    const rows = [...selectedVols].map(vid => ({event_id: currentEventId, volunteer_id: vid, status: 'assigned'}));
    await supabase.from('event_assignments').insert(rows);
  }
  toast(selectedVols.size + ' volunteer(s) assigned', true);
  document.getElementById('assign-section').style.display = 'none';
});

async function loadAssignments(id) {}
</script>
</body></html>
