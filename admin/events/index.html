<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Events | HAC</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div style="height:20px;background-image:conic-gradient(#2E7D52 90deg,#F5CB00 90deg 180deg,#2E7D52 180deg 270deg,#F5CB00 270deg);background-size:20px 20px"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Events</div></div>
</header>
<main class="main">
  <div id="list-view">
    <div class="section-head">Pending</div><div class="card" id="list-pending"><div class="empty">Loading...</div></div>
    <div class="section-head">Approved</div><div class="card" id="list-approved"><div class="empty">Loading...</div></div>
    <div class="section-head">Past</div><div class="card" id="list-past"><div class="empty">Loading...</div></div>
  </div>
  <div id="detail-view" style="display:none">
    <div class="page-head"><h2 id="det-name"></h2><p id="det-loc"></p></div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div class="card" style="margin:0"><div id="det-fields"></div></div>
      <div id="det-actions" style="display:flex;flex-direction:column;gap:8px"></div>
      <div id="assign-wrap" style="display:none">
        <div class="section-head" style="padding-left:0;margin-bottom:8px">Assign volunteers</div>
        <div class="card" style="margin:0" id="vol-list"></div>
        <button class="btn btn-primary" style="margin-top:8px" onclick="confirmAssign()">Confirm assignment</button>
      </div>
    </div>
  </div>
</main>
<nav class="bot-nav">

  <a href="../calls/index.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.69 13a19.79 19.79 0 01-3.07-8.67A2 2 0 013.56 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>Calls</a>

</nav>
<div class="toast" id="toast"></div>
<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
let curId=null,selVols=new Set(),allVols=[];

async function loadList(){
  document.getElementById('list-view').style.display='';
  document.getElementById('detail-view').style.display='none';
  const{data:events}=await supabase.from('events').select('*').order('date');
  const by={pending:[],approved:[],past:[]};
  (events||[]).forEach(e=>{const k=e.status==='declined'||e.status==='completed'?'past':e.status;if(by[k])by[k].push(e);});
  const sc={pending:'pill-warn',approved:'pill-green',declined:'pill-danger',completed:'pill-gray'};
  const row=e=>`<div class="row" onclick="showDetail('${e.id}')" style="cursor:pointer"><div class="row-body"><div class="row-title">${e.name}</div><div class="row-sub">${e.date} &middot; ${e.location}</div></div><span class="pill ${sc[e.status]||'pill-gray'}">${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span></div>`;
  ['pending','approved','past'].forEach(k=>{document.getElementById('list-'+k).innerHTML=by[k].length?by[k].map(row).join(''):'<div class="empty">None</div>';});
}

async function showDetail(id){
  curId=id;
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='';
  document.getElementById('assign-wrap').style.display='none';
  const{data:e}=await supabase.from('events').select('*').eq('id',id).single();
  document.getElementById('det-name').textContent=e.name;
  document.getElementById('det-loc').textContent=e.date+' · '+e.location;
  document.getElementById('det-fields').innerHTML=[['Date',e.date],['Location',e.location],['Attendees',e.attendees||'–'],['Contact',e.contact_name||'–'],['Phone',e.contact_phone||'–'],['Notes',e.notes||'–']].map(([l,v])=>`<div class="row"><div class="row-body"><div class="row-sub">${l}</div><div class="row-title">${v}</div></div></div>`).join('');
  const a=document.getElementById('det-actions');
  if(e.status==='pending'){a.innerHTML=`<button class="btn btn-primary" onclick="setStatus('approved')">Approve event</button><button class="btn btn-danger" onclick="setStatus('declined')">Decline</button><button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;}
  else if(e.status==='approved'){a.innerHTML=`<button class="btn btn-primary" onclick="showAssign()">Assign volunteers</button><button class="btn btn-ghost" onclick="setStatus('completed')">Mark completed</button><button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;}
  else{a.innerHTML=`<button class="btn btn-ghost" onclick="loadList()">&#8592; Back</button>`;}
}

async function setStatus(s){await supabase.from('events').update({status:s,updated_at:new Date().toISOString()}).eq('id',curId);toast('Event '+s,true);setTimeout(loadList,800);}

async function showAssign(){
  document.getElementById('assign-wrap').style.display='';
  const{data:vols}=await supabase.from('volunteers').select('*').eq('active',true).eq('role','volunteer');
  allVols=vols||[];
  const{data:ex}=await supabase.from('event_assignments').select('volunteer_id').eq('event_id',curId);
  selVols=new Set((ex||[]).map(a=>a.volunteer_id));
  renderVols();
}

function renderVols(){document.getElementById('vol-list').innerHTML=allVols.map(v=>`<div class="row" onclick="toggleVol('${v.id}')" style="cursor:pointer"><div class="row-icon" style="background:${selVols.has(v.id)?'var(--gl)':'#F5F5F5'}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${selVols.has(v.id)?'#2E7D52':'#9CA3AF'}" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="row-body"><div class="row-title">${v.name}</div><div class="row-sub">${v.qualification||'Volunteer'}</div></div>${selVols.has(v.id)?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>`).join('')||'<div class="empty">No volunteers</div>'}

function toggleVol(id){if(selVols.has(id))selVols.delete(id);else selVols.add(id);renderVols();}

async function confirmAssign(){
  await supabase.from('event_assignments').delete().eq('event_id',curId);
  if(selVols.size)await supabase.from('event_assignments').insert([...selVols].map(vid=>({event_id:curId,volunteer_id:vid,status:'assigned'})));
  toast(selVols.size+' volunteer(s) assigned',true);
  document.getElementById('assign-wrap').style.display='none';
}

loadList();
</script>
</body></html>
