<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Volunteers | HAC Admin</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">Volunteers</div></div>
  <div class="hac-header-right"><button onclick="document.getElementById('add-modal').classList.add('open')" style="background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer">+ Add</button></div>
</header>
<main class="main">
  <div class="section-head" id="vol-count">Loading...</div>
  <div class="card" id="vol-list"><div class="empty">Loading...</div></div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../events/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Events</a>
  <a href="../volunteers/index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Volunteers</a>
  <a href="../calls/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Calls</a>
  <a href="../settings/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
</nav>
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Add volunteer</h3>
    <div class="form-group"><label class="form-label">Full name</label><input class="form-input" id="new-name" placeholder="Tom Bradley"></div>
    <div class="form-group"><label class="form-label">Username (login)</label><input class="form-input" id="new-user" placeholder="tom.bradley"></div>
    <div class="form-group"><label class="form-label">Phone</label><input class="form-input" type="tel" id="new-phone" placeholder="07700 900000"></div>
    <div class="form-group">
      <label class="form-label">Qualification</label>
      <select class="form-input" id="new-qual"><option>First aider</option><option>Trainee</option><option>Driver</option></select>
    </div>
    <div class="form-group"><label class="form-label">Temporary password</label><input class="form-input" id="new-pass" type="text" placeholder="Change on first login"></div>
    <button class="btn btn-primary" onclick="addVolunteer()">Create account</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../../shared/auth.js"></script>
<script>
async function loadVols() {
  const { data: vols } = await supabase.from('volunteers').select('*').order('name');
  const list = vols || [];
  document.getElementById('vol-count').textContent = list.length + ' volunteers';
  document.getElementById('vol-list').innerHTML = list.length ? list.map(v => `
    <div class="row">
      <div class="row-icon" style="background:${v.active?'var(--gl)':'#F5F5F5'}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${v.active?'#2E7D52':'#9CA3AF'}" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="row-body">
        <div class="row-title">${v.name} ${v.role==='admin'?'<span class="pill pill-blue" style="font-size:10px">Admin</span>':''}</div>
        <div class="row-sub">${v.qualification||'Volunteer'} &middot; ${v.phone||'No phone'}</div>
      </div>
      <span class="pill ${v.active?'pill-green':'pill-gray'}">${v.active?'Active':'Inactive'}</span>
    </div>`).join('') : '<div class="empty">No volunteers yet</div>';
}

async function addVolunteer() {
  const name = document.getElementById('new-name').value.trim();
  const user = document.getElementById('new-user').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  const qual = document.getElementById('new-qual').value;
  const pass = document.getElementById('new-pass').value.trim();
  if (!name||!user||!pass) { toast('Fill all required fields',false); return; }
  const email = user + '@hac.internal';
  const { data, error } = await supabase.auth.signUp({email, password:pass});
  if (error) { toast(error.message,false); return; }
  await supabase.from('volunteers').insert({user_id:data.user.id,name,email,phone,role:'volunteer',qualification:qual,active:true});
  toast('Volunteer added',true);
  document.getElementById('add-modal').classList.remove('open');
  loadVols();
}

(async () => { await requireAdmin(); loadVols(); })();
</script>
</body></html>
