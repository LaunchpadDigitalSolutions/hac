<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Add volunteer</h3>
    <div class="form-group"><label class="form-label">Full name</label><input class="form-input" id="new-name" placeholder="Tom Bradley"></div>
    <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="new-user" placeholder="tom.bradley"></div>
    <div class="form-group"><label class="form-label">Phone</label><input class="form-input" type="tel" id="new-phone"></div>
    <div class="form-group"><label class="form-label">Qualification</label><select class="form-input" id="new-qual"><option>First aider</option><option>Trainee</option><option>Driver</option></select></div>
    <div class="form-group"><label class="form-label">Temp password</label><input class="form-input" id="new-pass" type="text"></div>
    <button class="btn btn-primary" onclick="addVol()">Create account</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
async function loadVols(){
  const{data:vols}=await supabase.from('volunteers').select('*').order('name');
  const list=vols||[];
  document.getElementById('vol-count').textContent=list.length+' volunteers';
  document.getElementById('vol-list').innerHTML=list.length?list.map(v=>`<div class="row"><div class="row-icon" style="background:${v.active?'var(--gl)':'#F5F5F5'}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${v.active?'#2E7D52':'#9CA3AF'}" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="row-body"><div class="row-title">${v.name} ${v.role==='admin'?'<span class="pill pill-blue" style="font-size:10px">Admin</span>':''}</div><div class="row-sub">${v.qualification||'Volunteer'} &middot; ${v.phone||'No phone'}</div></div><span class="pill ${v.active?'pill-green':'pill-gray'}">${v.active?'Active':'Inactive'}</span></div>`).join(''):'<div class="empty">No volunteers yet</div>';
}
async function addVol(){
  const name=document.getElementById('new-name').value.trim();
  const user=document.getElementById('new-user').value.trim();
  const phone=document.getElementById('new-phone').value.trim();
  const qual=document.getElementById('new-qual').value;
  const pass=document.getElementById('new-pass').value.trim();
  if(!name||!user||!pass){toast('Fill all fields',false);return;}
  const email=user+'@hac.internal';
  const{data,error}=await supabase.auth.signUp({email,password:pass});
  if(error){toast(error.message,false);return;}
  await supabase.from('volunteers').insert({user_id:data.user.id,name,email,phone,role:'volunteer',qualification:qual,active:true});
  toast('Added',true);document.getElementById('add-modal').classList.remove('open');loadVols();
}
loadVols();
</script>
</body></html>
