<script>const supabase = window.supabase.createClient('https://zwndffsorkqsjykauepp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bmRmZnNvcmtxc2p5a2F1ZXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzY4NDUsImV4cCI6MjA5ODExMjg0NX0.07KfE2A_sxEfGq1oPnEFvTihs0o54ZuTHG7DuMls7g0', {db:{schema:'hac'}});
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDuration(s){if(!s)return'0:00';const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.background=ok===false?'#B91C1C':'#1A1A1A';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
(async()=>{
  const today=new Date().toISOString().split('T')[0];
  const[ev,vl,cl]=await Promise.all([
    supabase.from('events').select('*').order('created_at',{ascending:false}),
    supabase.from('volunteers').select('id').eq('active',true),
    supabase.from('calls').select('id').gte('created_at',today+'T00:00:00')
  ]);
  const events=ev.data||[];
  const pending=events.filter(e=>e.status==='pending');
  const upcoming=events.filter(e=>e.status==='approved');
  document.getElementById('s-pending').textContent=pending.length;
  document.getElementById('s-vols').textContent=(vl.data||[]).length;
  document.getElementById('s-calls').textContent=(cl.data||[]).length;
  const sc={pending:'pill-warn',approved:'pill-green',declined:'pill-danger',completed:'pill-gray'};
  const row=e=>`<a href="events/index.html?id=${e.id}" class="row"><div class="row-icon" style="background:var(--gl)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="row-body"><div class="row-title">${e.name}</div><div class="row-sub">${e.date} &middot; ${e.location}</div></div><span class="pill ${sc[e.status]||'pill-gray'}">${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span></a>`;
  document.getElementById('pending-card').innerHTML=pending.length?pending.map(row).join(''):'<div class="empty">No pending requests</div>';
  document.getElementById('upcoming-card').innerHTML=upcoming.length?upcoming.map(row).join(''):'<div class="empty">No upcoming events</div>';
})();
</script>
