<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2E7D52">
<title>Dashboard | HAC Admin</title>
<link rel="stylesheet" href="../shared/hac.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="checker"></div>
<header class="hac-header">
  <img src="../shared/hac-logo.jpg" alt="HAC">
  <div><div class="title">HAC Admin</div><div class="sub" id="admin-name">Loading...</div></div>
  <div class="hac-header-right"><button onclick="hacSignOut('../admin/login/')" style="background:none;border:none;color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer">Sign out</button></div>
</header>
<main class="main">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-pending">–</div><div class="stat-label">Pending events</div></div>
    <div class="stat"><div class="stat-num" id="s-volunteers">–</div><div class="stat-label">Volunteers</div></div>
    <div class="stat"><div class="stat-num" id="s-calls">–</div><div class="stat-label">Calls today</div></div>
  </div>
  <div class="section-head">Pending approval</div>
  <div class="card" id="pending-events"><div class="empty">Loading...</div></div>
  <div class="section-head">Upcoming events</div>
  <div class="card" id="upcoming-events"><div class="empty">Loading...</div></div>
</main>
<nav class="bot-nav">
  <a href="../index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="../events/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Events</a>
  <a href="../volunteers/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Volunteers</a>
  <a href="../calls/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Calls</a>
  <a href="../settings/index.html" class="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
</nav>
<div class="toast" id="toast"></div>
<script src="../shared/auth.js"></script>
<script>
(async () => {
  const profile = await requireAdmin();
  if (!profile) return;
  document.getElementById('admin-name').textContent = profile.name;

  const today = new Date().toISOString().split('T')[0];

  const [evRes, volRes, callRes] = await Promise.all([
    supabase.from('events').select('*').order('created_at', {ascending:false}),
    supabase.from('volunteers').select('id').eq('active', true),
    supabase.from('calls').select('id').gte('created_at', today + 'T00:00:00')
  ]);

  const events = evRes.data || [];
  const pending = events.filter(e => e.status === 'pending');
  const upcoming = events.filter(e => e.status === 'approved');

  document.getElementById('s-pending').textContent = pending.length;
  document.getElementById('s-volunteers').textContent = (volRes.data||[]).length;
  document.getElementById('s-calls').textContent = (callRes.data||[]).length;

  function eventRow(e) {
    const sc = {pending:'pill-warn',approved:'pill-green',declined:'pill-danger',completed:'pill-gray'};
    return `<a href="events/index.html?id=${e.id}" class="row">
      <div class="row-icon" style="background:var(--gl)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D52" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="row-body">
        <div class="row-title">${e.name}</div>
        <div class="row-sub">${e.date} &middot; ${e.location}</div>
      </div>
      <span class="pill ${sc[e.status]||'pill-gray'}">${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span>
    </a>`;
  }

  document.getElementById('pending-events').innerHTML = pending.length ? pending.map(eventRow).join('') : '<div class="empty">No pending requests</div>';
  document.getElementById('upcoming-events').innerHTML = upcoming.length ? upcoming.map(eventRow).join('') : '<div class="empty">No upcoming events</div>';
})();
</script>
</body></html>
